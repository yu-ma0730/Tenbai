//+------------------------------------------------------------------+
// XAUUSD Pro Trading Tool - Scalping Configuration (M15)
// 推奨設定：スキャルピング用（M15 時間足）
// 保有期間：15分～1時間
// 更新日時: 2024.07.21
//+------------------------------------------------------------------+

// RSI Settings
RSI_Overbought=70.0         // 買われすぎ閾値
RSI_Oversold=30.0           // 売られすぎ閾値
RSI_Period=10               // RSI 期間（短く設定）

// MACD Settings
MACD_Fast=12                // MACD 短期 EMA
MACD_Slow=26                // MACD 長期 EMA
MACD_Signal=9               // MACD シグナルライン期間

// EMA Settings (M15 用に短く調整)
EMA_Fast=9                  // 短期 EMA（非常に敏感）
EMA_Slow=21                 // 長期 EMA（短期トレンド確認）

// Risk Management
Risk_Percent=1.0            // 1 トレード当たりリスク %
                            // スキャルピングは負けが多いため低めに設定

// Signal Filtering
MinBarsSinceSignal=2        // シグナル間の最小足数
                            // M15 で 2 足 = 30 分
                            // = 高頻度トレード

// Notification Settings
UseSoundAlert=true
UseNotification=true

//+------------------------------------------------------------------+
// スキャルピング向けパラメータ特性
//+------------------------------------------------------------------+
// RSI_Period=10
//   → より敏感に反応
//   → 短期的な買われすぎ/売られすぎを検出
//
// EMA_Fast=9, EMA_Slow=21
//   → 非常に短い周期
//   → 小さな価格動きもキャッチ
//   → ノイズも多い（要フィルタリング）
//
// MinBarsSinceSignal=2
//   → 高頻度シグナル（30 分ごと）
//   → 多くのトレード機会

//+------------------------------------------------------------------+
// 運用方法
//+------------------------------------------------------------------+
// 1. M15 チャートを開く
// 2. この設定で EA 起動（画面に貼り付けて監視推奨）
// 3. 保有時間：通常 15 分 ～ 1 時間
// 4. ストップロス：5~10pips（直近スイング値）
// 5. テイクプロフィット：10~20pips（リスク:リワード = 1:1 以上）
// 6. 1 日の取引上限：最大 5~10 トレード（疲れ防止）

//+------------------------------------------------------------------+
// 推奨時間帯
//+------------------------------------------------------------------+
// ✅ 最適な時間帯：
//    ├─ 日本時間 08:00~11:00（東京オープン）
//    ├─ 日本時間 14:00~17:00（ロンドンオープン）
//    └─ 日本時間 22:00~翌01:00（米国オープン）
//
// ⚠️ 避けるべき時間帯：
//    ├─ 重要経済指標前後 30 分
//    ├─ ロンドン ～ 米国オープン間（不安定）
//    └─ 夜中・早朝の低流動性時間帯

//+------------------------------------------------------------------+
// 注意事項
//+------------------------------------------------------------------+
// ・高頻度トレードのため、スプレッドコストが重要
// ・通常スプレッド 0.5~1.5 pips のブローカー推奨
// ・精神的疲労が大きい（1 日 2~3 時間程度の運用を推奨）
// ・損失許容額（Risk_Percent）は低めに設定
// ・連続損失時の判断停止ルール：5 連敗で一旦休止

//+------------------------------------------------------------------+
// スキャルピングは難易度が高いため、以下を推奨:
// 1. デモ口座で最低 2 週間練習
// 2. リアルでも 0.01 ロット からスタート
// 3. 勝率 50% 以上を達成してから スケールアップ
//+------------------------------------------------------------------+

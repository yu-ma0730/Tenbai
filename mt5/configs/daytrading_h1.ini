//+------------------------------------------------------------------+
// XAUUSD Pro Trading Tool - Daytrading Configuration (H1)
// 推奨設定：デイトレード用（H1 時間足）
// 更新日時: 2024.07.21
//+------------------------------------------------------------------+

// RSI Settings
RSI_Overbought=70.0         // 買われすぎ閾値
RSI_Oversold=30.0           // 売られすぎ閾値
RSI_Period=14               // RSI 期間（標準）

// MACD Settings
MACD_Fast=12                // MACD 短期 EMA
MACD_Slow=26                // MACD 長期 EMA
MACD_Signal=9               // MACD シグナルライン期間

// EMA Settings
EMA_Fast=20                 // 短期 EMA（トレンド確認）
EMA_Slow=50                 // 長期 EMA（大きなトレンド）

// Risk Management
Risk_Percent=2.0            // 1 トレード当たりリスク %（推奨 2%）

// Signal Filtering
MinBarsSinceSignal=3        // シグナル間の最小足数
                            // 3足 = より多くのシグナル
                            // 5足 = より信頼度の高いシグナル

// Notification Settings
UseSoundAlert=true          // MT5 チャートアラート音
UseNotification=true        // モバイル通知（要 MT5 app）

//+------------------------------------------------------------------+
// パラメータの意味
//+------------------------------------------------------------------+
// RSI_Overbought
//   └─ 70 以上 = 買われすぎ（売りシグナル候補）
//      高すぎるとシグナルが少ない、低いと誤信号増加
//
// RSI_Oversold
//   └─ 30 以下 = 売られすぎ（買いシグナル候補）
//      低すぎるとシグナルが少ない、高いと誤信号増加
//
// EMA_Fast (20)
//   └─ 短期トレンドを追従
//      短いほど反応敏感（偽信号増）
//      長いほど遅い（反応遅延）
//
// EMA_Slow (50)
//   └─ 中期トレンドの確認用
//      短いほど敏感、長いほど安定的
//
// MinBarsSinceSignal (3)
//   └─ シグナル連発を防ぐフィルタ
//      3足ごと = より多くのチャンス
//      5足ごと = より安定的

//+------------------------------------------------------------------+
// 推奨使用方法
//+------------------------------------------------------------------+
// 1. H1 時間足を開く
// 2. この設定で EA を起動
// 3. 3~5 日間デモ口座で検証
// 4. 問題なければ小額リアル口座で運用開始
// 5. 市場環境に応じて微調整

//+------------------------------------------------------------------+
// パラメータ調整ガイド
//+------------------------------------------------------------------+
// 誤信号が多い場合:
//   → RSI_Period を 21 に変更（より安定）
//   → EMA_Slow を 100 に変更（トレンド確認を厳しく）
//   → MinBarsSinceSignal を 5 に変更（シグナル少なく、信頼度高）
//
// シグナルが少ない場合:
//   → RSI_Overbought を 75 に、RSI_Oversold を 25 に変更
//   → MinBarsSinceSignal を 1 に変更（シグナル多く）
//   → EMA_Fast を 15 に変更（より敏感に反応）
//
// トレンド逆行でやられる場合:
//   → EMA_Slow を 100 に変更（より長期トレンド重視）
//   → MACD パラメータを (15, 30, 9) に変更

//+------------------------------------------------------------------+

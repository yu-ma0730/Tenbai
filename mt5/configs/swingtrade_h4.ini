//+------------------------------------------------------------------+
// XAUUSD Pro Trading Tool - Swing Trade Configuration (H4)
// 推奨設定：スイングトレード用（H4 時間足）
// 保有期間：1日～数日間
// 更新日時: 2024.07.21
//+------------------------------------------------------------------+

// RSI Settings
RSI_Overbought=70.0         // 買われすぎ閾値
RSI_Oversold=30.0           // 売られすぎ閾値
RSI_Period=14               // RSI 期間

// MACD Settings
MACD_Fast=12                // MACD 短期 EMA
MACD_Slow=26                // MACD 長期 EMA
MACD_Signal=9               // MACD シグナルライン期間

// EMA Settings (H4 用に調整)
EMA_Fast=30                 // 短期 EMA（より長期トレンド）
EMA_Slow=100                // 長期 EMA（大きなトレンド確認）

// Risk Management
Risk_Percent=2.0            // 1 トレード当たりリスク %

// Signal Filtering
MinBarsSinceSignal=5        // シグナル間の最小足数
                            // H4 時間足では 5 足 = 20 時間
                            // = より安定的なシグナル

// Notification Settings
UseSoundAlert=true
UseNotification=true

//+------------------------------------------------------------------+
// スイングトレード向けパラメータ特性
//+------------------------------------------------------------------+
// EMA_Fast=30, EMA_Slow=100
//   → H1 より長い周期設定
//   → より大きなトレンドに従う
//   → ノイズに強い
//
// MinBarsSinceSignal=5
//   → H4 で 5 足 = 20 時間
//   → シグナル連発を抑制
//   → 確実なトレンド転換のみを検出

//+------------------------------------------------------------------+
// 運用方法
//+------------------------------------------------------------------+
// 1. H4 チャートを開く
// 2. この設定で EA 起動
// 3. 保有期間：通常 1~3 日間
// 4. ストップロス：直近スイング安値/高値
// 5. テイクプロフィット：リスク:リワード = 1:2 以上

//+------------------------------------------------------------------+
// 注意事項
//+------------------------------------------------------------------+
// ・H4 での運用のため、相場を見られない時間帯の運用が主体
// ・週末付近での持ち越しはギャップリスクに注意
// ・金曜夜 ～ 月曜朝の間は注意深くモニタリング
// ・重要経済指標（FOMC など）の前日は平建てを推奨

//+------------------------------------------------------------------+
